name: Apply verified quest buffer
on:
  push:
    branches: [feat/quest-ready-buffer]
    paths: [.github/workflows/buffer-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/quest-ready-buffer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify and apply tested patch
        run: |
          python3 - <<'PY'
          import base64, lzma, hashlib, pathlib
          data = ''.join(pathlib.Path(f'scripts/buffer-patch.{i}.b64').read_text().strip() for i in range(1, 4))
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '52d7d1278834e536b61e6ccef211cbb381f0c82c33d301ff0f4f5aab01d1703c'
          pathlib.Path('/tmp/ready-buffer.patch').write_bytes(patch)
          PY
          git apply --check /tmp/ready-buffer.patch
          git apply /tmp/ready-buffer.patch
          git rm .github/workflows/buffer-apply.yml scripts/buffer-patch.1.b64 scripts/buffer-patch.2.b64 scripts/buffer-patch.3.b64
          git add -A
          git diff --cached --check
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(quest): bounded ready buffer with low-water refill and quota safety'
          git push origin HEAD:refs/heads/feat/quest-ready-buffer
